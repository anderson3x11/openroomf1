<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f4f4f0" media="(prefers-color-scheme: light)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
		/>
		<script>
			// Apply the saved theme before the first paint (see src/lib/ui.svelte.ts).
			try {
				const pref = localStorage.getItem('openroom-theme') ?? 'auto';
				const dark = matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.dataset.theme = pref === 'auto' ? (dark ? 'dark' : 'light') : pref;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
