[project]
name = "openroomf1"
version = "0.1.0"
description = "Post-race Formula 1 analysis pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastf1",
    "numpy",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
